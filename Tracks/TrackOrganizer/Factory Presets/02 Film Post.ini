; ICSS Track Organizer preset: Film Post

[settings]
create_folders=true
move_existing_folders=true
existing_folders=atomic
unknown_tracks=folder
unknown_folder_name=OTHER
subfolder_min_tracks=3
subfolder_min_elements=2
numbered_family_min_tracks=3
case_sensitive=false
preserve_relative_order=true
intro_first=true
outro_last=true
main_first=true
group_similar_names=true
natural_name_sort=true
dry_run=false
debug=false

[modifier:intro]
name=Intro / Head
placement=first
order=10
enabled=true
patterns=intro; head; opening

[modifier:main]
name=Main before alternates
placement=family_first
order=20
enabled=true
patterns=main; master; hero

[modifier:outro]
name=Outro / Tail
placement=last
order=30
enabled=true
patterns=outro; tail; ending

[category:dialogue]
name=DIALOGUE / ADR
folder=DIALOGUE
container=folder
order=10
priority=0
enabled=true
patterns=dialogue; dialog; dx; production sound; prod sound

[rule:dialogue.adr]
name=ADR
parent=dialogue
container=none
order=10
priority=190
enabled=true
patterns=adr; loop group; walla

[rule:dialogue.vo]
name=Voiceover
parent=dialogue
container=none
order=20
priority=180
enabled=true
patterns=voiceover; voice over; vo; narration; narrator

[category:foley]
name=FOLEY
folder=FOLEY
container=folder
order=20
priority=0
enabled=true
patterns=foley

[rule:foley.steps]
name=Footsteps
parent=foley
container=none
order=10
priority=180
enabled=true
patterns=footstep; footsteps; steps; walk; run

[rule:foley.props]
name=Props / Cloth
parent=foley
container=none
order=20
priority=160
enabled=true
patterns=prop; props; cloth; movement; handling

[category:sfx]
name=SFX
folder=SFX
container=folder
order=30
priority=0
enabled=true
patterns=sfx; sound effect; effects; hard fx

[category:ambience]
name=AMBIENCE
folder=AMBIENCE
container=folder
order=40
priority=0
enabled=true
patterns=ambience; ambiance; atmos; background; bg; room tone

[category:music]
name=MUSIC
folder=MUSIC
container=folder
order=50
priority=0
enabled=true
patterns=music; score; mx; cue

[category:prints]
name=PRINTS / DELIVERABLES
container=order
order=60
priority=0
enabled=true

[rule:prints.mix]
name=Mix Print
parent=prints
container=none
order=10
priority=190
enabled=true
patterns=print; full mix; final mix; master; bounce

[rule:prints.stem]
name=Stems
parent=prints
container=none
order=20
priority=180
enabled=true
patterns=stem; stems; dx stem; mx stem; fx stem; m&e; me stem

[category:other]
name=OTHER / UNCLASSIFIED
folder=OTHER
container=folder
order=9999
priority=-1000
enabled=true
special=true
