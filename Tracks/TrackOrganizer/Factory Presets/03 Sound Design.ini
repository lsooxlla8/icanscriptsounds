; ICSS Track Organizer preset: Sound Design

[settings]
create_folders=true
move_existing_folders=true
existing_folders=atomic
unknown_tracks=folder
unknown_folder_name=OTHER
subfolder_min_tracks=3
subfolder_min_elements=2
numbered_family_min_tracks=3
case_sensitive=false
preserve_relative_order=true
intro_first=true
outro_last=true
main_first=true
group_similar_names=true
natural_name_sort=true
dry_run=false
debug=false

[modifier:intro]
name=Intro / Start
placement=first
order=10
enabled=true
patterns=intro; start; opening

[modifier:main]
name=Main / Hero first
placement=family_first
order=20
enabled=true
patterns=main; hero; primary

[modifier:outro]
name=Outro / Tail
placement=last
order=30
enabled=true
patterns=outro; tail; ending

[category:impacts]
name=IMPACTS / HITS
folder=IMPACTS
container=folder
order=10
priority=0
enabled=true
patterns=impact; impacts; hit; hits; slam; boom; thud

[category:transitions]
name=TRANSITIONS
folder=TRANSITIONS
container=folder
order=20
priority=0
enabled=true

[rule:transitions.riser]
name=Risers
parent=transitions
container=none
order=10
priority=180
enabled=true
patterns=riser; rise; uplifter; build; buildup

[rule:transitions.down]
name=Downlifters
parent=transitions
container=none
order=20
priority=180
enabled=true
patterns=downlifter; downer; fall; descend; drop fx

[rule:transitions.whoosh]
name=Whooshes / Sweeps
parent=transitions
container=none
order=30
priority=170
enabled=true
patterns=whoosh; woosh; swoosh; swish; sweep; passby; pass by

[category:textures]
name=TEXTURES / AMBIENCE
folder=TEXTURES
container=folder
order=30
priority=0
enabled=true
patterns=texture; textures; ambience; ambiance; atmos; drone; bed; soundscape

[category:foley]
name=FOLEY / REAL WORLD
folder=FOLEY
container=folder
order=40
priority=0
enabled=true
patterns=foley; footstep; footsteps; cloth; prop; handling; movement

[category:designed]
name=DESIGNED / SYNTHETIC
folder=DESIGNED
container=folder
order=50
priority=0
enabled=true
patterns=designed; design; synthetic; synth fx; processed; resample; resampled

[category:source]
name=SOURCE / RECORDINGS
container=order
order=60
priority=0
enabled=true

[rule:source.raw]
name=Raw Source
parent=source
container=none
order=10
priority=140
enabled=true
patterns=source; raw; original; recording; field recording

[rule:source.print]
name=Prints / Renders
parent=source
container=none
order=20
priority=180
enabled=true
patterns=print; render; rendered; bounce; master

[category:other]
name=OTHER / UNCLASSIFIED
folder=OTHER
container=folder
order=9999
priority=-1000
enabled=true
special=true
