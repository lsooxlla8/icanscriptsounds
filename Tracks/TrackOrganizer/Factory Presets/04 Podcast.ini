; ICSS Track Organizer preset: Podcast

[settings]
create_folders=true
move_existing_folders=true
existing_folders=atomic
unknown_tracks=folder
unknown_folder_name=OTHER
subfolder_min_tracks=3
subfolder_min_elements=2
numbered_family_min_tracks=3
case_sensitive=false
preserve_relative_order=true
intro_first=true
outro_last=true
main_first=true
group_similar_names=true
natural_name_sort=true
dry_run=false
debug=false

[modifier:intro]
name=Intro / Cold Open
placement=first
order=10
enabled=true
patterns=intro; cold open; opening

[modifier:main]
name=Main before alternates
placement=family_first
order=20
enabled=true
patterns=main; master

[modifier:outro]
name=Outro / Credits
placement=last
order=30
enabled=true
patterns=outro; credits; ending

[category:voices]
name=VOICES
folder=VOICES
container=folder
order=10
priority=0
enabled=true

[rule:voices.host]
name=Host
parent=voices
container=none
order=10
priority=170
enabled=true
patterns=host; presenter; anchor

[rule:voices.guest]
name=Guest
parent=voices
container=none
order=20
priority=170
enabled=true
patterns=guest; interviewee; caller; remote

[rule:voices.vo]
name=Voiceover / Narration
parent=voices
container=none
order=30
priority=160
enabled=true
patterns=voiceover; voice over; vo; narration; narrator

[rule:voices.pickups]
name=Pickups
parent=voices
container=none
order=40
priority=190
enabled=true
patterns=pickup; pickups; correction; fix; insert

[category:production]
name=PRODUCTION
container=order
order=20
priority=0
enabled=true

[rule:production.music]
name=Music / Beds
parent=production
container=none
order=10
priority=140
enabled=true
patterns=music; bed; theme; sting; stinger; bumper; jingle

[rule:production.sfx]
name=SFX
parent=production
container=none
order=20
priority=140
enabled=true
patterns=sfx; sound effect; fx; effect; transition

[rule:production.ambience]
name=Room Tone / Ambience
parent=production
container=none
order=30
priority=160
enabled=true
patterns=room tone; roomtone; ambience; ambiance; atmos

[rule:production.print]
name=Print / Master
parent=production
container=none
order=40
priority=190
enabled=true
patterns=print; mix; master; bounce; final

[category:other]
name=OTHER / UNCLASSIFIED
folder=OTHER
container=folder
order=9999
priority=-1000
enabled=true
special=true
