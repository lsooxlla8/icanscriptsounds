; ICSS Track Organizer preset: Audiobook

[settings]
create_folders=true
move_existing_folders=true
existing_folders=atomic
unknown_tracks=folder
unknown_folder_name=OTHER
subfolder_min_tracks=3
subfolder_min_elements=2
numbered_family_min_tracks=999
case_sensitive=false
preserve_relative_order=true
intro_first=true
outro_last=true
main_first=true
group_similar_names=true
natural_name_sort=true
dry_run=false
debug=false

[modifier:intro]
name=Intro / Opening
placement=first
order=10
enabled=true
patterns=intro; opening; prologue

[modifier:main]
name=Main take before alternates
placement=family_first
order=20
enabled=true
patterns=main; master

[modifier:outro]
name=Outro / Ending
placement=last
order=30
enabled=true
patterns=outro; ending; epilogue

[category:book]
name=BOOK ORDER
container=order
order=10
priority=0
enabled=true

[rule:book.intro]
name=Intro / Prologue
parent=book
container=none
order=10
priority=180
enabled=true
patterns=intro; opening; prologue; title; foreword

[rule:book.chapters]
name=Chapters
parent=book
container=order
order=20
priority=150
enabled=true
patterns=chapter; chapters; ch; part; section

[rule:book.narration]
name=Narration
parent=book.chapters
container=none
order=10
priority=140
enabled=true
patterns=narration; narrator; read; reading; voice; voiceover; vo; take

[rule:book.pickups]
name=Pickups / Corrections
parent=book.chapters
container=none
order=20
priority=180
enabled=true
patterns=pickup; pickups; correction; corrections; fix; fixes; insert; patch

[rule:book.room]
name=Room Tone
parent=book
container=none
order=30
priority=180
enabled=true
patterns=room tone; roomtone; noise floor; silence; wild room

[rule:book.music]
name=Music
parent=book
container=none
order=40
priority=130
enabled=true
patterns=music; score; theme; bed; sting; stinger

[rule:book.sfx]
name=Sound Effects
parent=book
container=none
order=50
priority=130
enabled=true
patterns=sfx; sound effect; sound effects; fx; effect

[rule:book.credits]
name=Credits
parent=book
container=none
order=60
priority=180
enabled=true
patterns=credits; end credits; copyright; publisher; author note

[rule:book.outro]
name=Outro / Epilogue
parent=book
container=none
order=70
priority=180
enabled=true
patterns=outro; ending; epilogue; closing

[category:other]
name=OTHER / UNCLASSIFIED
folder=OTHER
container=folder
order=9999
priority=-1000
enabled=true
special=true
