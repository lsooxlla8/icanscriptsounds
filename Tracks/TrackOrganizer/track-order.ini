; ICSS Track Organizer rule library
; Derived from the active REAPER sws-autocoloricon.ini on 2026-08-11,
; then expanded for common professional multitrack, stem and scoring sessions.
;
; Matching is case-insensitive by default and punctuation becomes spaces.
; Plain entries match complete normalized words/phrases, so "sn" will not
; match "synth". Prefixes: exact:, wildcard:, lua:.
; More specific rules use a higher priority than their broad parent.

[settings]
create_folders=true
; false: classify a user folder from its folder-track name only.
; true: descendants may classify an otherwise unknown folder.
; In both modes the existing subtree moves atomically and is never flattened.
move_existing_folders=false
existing_folders=atomic
unknown_tracks=folder
unknown_folder_name=OTHER
; Configured subfolders appear only with at least this many matching tracks.
subfolder_min_tracks=3
; Number-suffix families get a folder only when there are more than 2 tracks.
numbered_family_min_tracks=3
case_sensitive=false
preserve_relative_order=true
; Folder-local name ordering: Intro first, Outro last, then similar-name
; families with natural numeric ordering (Hat, Hat 2, Hat 3).
intro_first=true
outro_last=true
; Within the same name family/rule area, MAIN variants precede the base name.
main_first=true
group_similar_names=true
natural_name_sort=true
dry_run=false
debug=false

